<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Skull Cove Broadside</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: full-screen cartoon 3D cove; HUD floats on top (status top, tally + log right, controls bottom) */
:root{
  --ink:#2b1d12; --paper:#fff7e6; --gold:#ffcd45; --red:#e2483d; --blue:#1d6fb0; --muted:#7a6248;
  --f-display:"Pirata One",Georgia,serif;
  --f-body:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#9fd6f2;color:var(--ink);font:600 15px/1.4 var(--f-body);overflow:hidden;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#gl.aim{cursor:crosshair}
.hud{position:fixed;inset:0;pointer-events:none;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr auto;gap:10px}
.hud > *{pointer-events:auto}
.top{grid-column:1/3;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.top > *{pointer-events:auto}
.brand small{display:inline-block;font:900 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--ink);padding:3px 9px;border-radius:99px}
.brand h1{margin:4px 0 0;font:400 clamp(32px,4.8vw,56px)/.95 var(--f-display);color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.status{font:800 clamp(14px,1.8vw,18px)/1.3 var(--f-body);text-align:center;max-width:52ch;align-self:center;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 14px;box-shadow:0 4px 0 var(--ink)}
.status b{color:#c2410c}
.side{grid-column:2;grid-row:2;align-self:start;width:min(290px,42vw);display:flex;flex-direction:column;gap:10px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;box-shadow:0 4px 0 var(--ink)}
.panel h3{margin:0 0 6px;font:400 23px/1 var(--f-display);display:flex;justify-content:space-between;align-items:baseline}
.panel h3 span{font:800 11px var(--f-body);color:var(--muted)}
.tally{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tally div{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:4px 7px}
.tally b{display:block;font:900 21px/1.05 var(--f-body);font-variant-numeric:tabular-nums}
.tally span{font:800 11px var(--f-body);color:var(--muted)}
.fleets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;font:700 13px var(--f-body)}
.fleets ul{list-style:none;margin:0;padding:0}
.fleets li{display:flex;justify-content:space-between}
.fleets li.lost{color:#a3927c;text-decoration:line-through}
.fleets h4{margin:0 0 3px;font:400 17px var(--f-display)}
.log{list-style:none;margin:0;padding:0;max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.log li{font-size:13.5px;padding-left:16px;position:relative}
.log li::before{content:"☠";position:absolute;left:0;top:0;font-size:11px;color:var(--muted)}
.log li.you{color:var(--blue)} .log li.bad{color:var(--red)}
.bottom{grid-column:1/3;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.btn{font:800 14px var(--f-body);color:var(--ink);background:var(--gold);border:3px solid var(--ink);border-radius:12px;padding:6px 12px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--paper)}
.btn.on{background:#8fd8ff}
.btn:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:2px}
select{font:800 14px var(--f-body);background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:5px 8px;box-shadow:0 3px 0 var(--ink)}
.fire{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;
  font:400 27px var(--f-display);color:#fff;background:radial-gradient(circle at 40% 35%,#ff7a4a,#d12f1f);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);pointer-events:auto}
.fire:disabled{filter:grayscale(.8);opacity:.6}
.spy{position:fixed;right:calc(max(18px,env(safe-area-inset-right,0px)) + 98px);bottom:calc(104px + env(safe-area-inset-bottom,0px));pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.labels span{position:absolute;left:0;top:0;font:900 13px/1 var(--f-body);color:#fff;background:rgba(29,90,150,.9);border:2px solid #fff;border-radius:8px;padding:3px 6px;white-space:nowrap}
.labels span.e{background:rgba(190,45,35,.92)}
#aimTip{position:fixed;left:0;top:0;pointer-events:none;font:900 15px var(--f-body);background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:4px 10px;box-shadow:0 3px 0 var(--ink);white-space:nowrap;z-index:3}
#aimTip.bad{background:#ffd3ca}
#mini{position:fixed;left:max(14px,env(safe-area-inset-left,0px));top:108px;height:min(430px,calc(100vh - 200px));aspect-ratio:180/430;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);cursor:crosshair;touch-action:none;z-index:2}
@media (max-width:720px){#mini{top:96px;height:min(250px,36vh)}}
#spyMask{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,transparent 0 37vmin,#e5ac3c 37.4vmin 39.2vmin,#2b1d12 39.5vmin 40.6vmin,rgba(8,14,22,.97) 41vmin)}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font:400 34px var(--f-display);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;background:linear-gradient(#5fb3e8,#c8ecfa)}
dialog{border:0;padding:0;background:transparent;max-width:min(92vw,440px)}
dialog::backdrop{background:rgba(20,40,60,.45)}
.scroll{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:18px;padding:24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 8px 0 var(--ink)}
.scroll h2{margin:0;font:400 48px/1 var(--f-display)}
.scroll p{margin:0}
.tech{font:800 11px var(--f-body);color:var(--ink);background:rgba(255,247,230,.85);border:2px solid var(--ink);border-radius:99px;padding:2px 8px}
@media (max-width:720px){
  .side{grid-column:1/3;grid-row:3;width:100%;flex-direction:row;overflow-x:auto}
  .side .panel{min-width:250px}
  .hud{grid-template-rows:auto 1fr auto auto}
  .bottom{grid-row:4}
  .log{max-height:90px}
  .status{order:3;width:100%}
}
</style>

<canvas id="gl" aria-label="Cartoon 3D view of Skull Cove. Click a square in Enemy Waters to fire."></canvas>
<div class="labels" id="labels" aria-hidden="true"></div>
<div id="spyMask" aria-hidden="true"></div>
<div id="aimTip" hidden></div>
<canvas id="mini" hidden aria-label="Mini map: enemy waters on top, your waters below. Click an enemy square to fire."></canvas>
<div class="loading" id="loading">Hoisting the sails…</div>

<div class="hud">
  <div class="top">
    <div class="brand"><small>Unit 5.9 · hidden-fleet battle</small><h1>Skull Cove Broadside</h1></div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
  <div class="side">
    <div class="panel">
      <h3>Tally <span id="phys">physics: …</span></h3>
      <div class="tally">
        <div><b id="tShots">0</b><span>Shots</span></div>
        <div><b id="tHits">0</b><span>Hits</span></div>
        <div><b id="tAcc">–</b><span>Accuracy</span></div>
      </div>
      <div class="fleets">
        <div><h4>Your fleet</h4><ul id="ownList"></ul></div>
        <div><h4>Enemy fleet</h4><ul id="enemyList"></ul></div>
      </div>
    </div>
    <div class="panel">
      <h3>Captain's Log</h3>
      <ul class="log" id="log"></ul>
    </div>
  </div>
  <div class="bottom">
    <span id="placeCtl">
      <button class="btn ghost" id="rotateBtn">Rotate (R)</button>
      <button class="btn ghost" id="shuffleBtn">Shuffle fleet</button>
      <button class="btn" id="sailBtn">Set sail</button>
    </span>
    <select id="difficulty" aria-label="Enemy captain">
      <option value="captain" selected>Enemy: Cunning Captain</option>
      <option value="deckhand">Enemy: Clumsy Deckhand</option>
    </select>
    <button class="btn ghost" id="tourBtn" aria-pressed="false">Camera tour (T)</button>
    <button class="btn ghost" id="capBtn" aria-pressed="false">Captain's view (V)</button>
    <button class="btn ghost" id="backBtn" hidden>Own waters (B)</button>
    <button class="btn ghost" id="soundBtn" aria-pressed="false">Sound: off</button>
    <button class="btn ghost" id="newBtn">New battle</button>
    <span class="tech" id="tech">three.js</span>
  </div>
</div>
<button class="fire" id="fireBtn" hidden disabled>Fire!</button>
<button class="btn ghost spy" id="spyBtn" hidden>Spyglass</button>

<dialog id="endDialog">
  <div class="scroll">
    <h2 id="endTitle">Victory!</h2>
    <p id="endText"></p>
    <button class="btn" id="againBtn">New battle</button>
  </div>
</dialog>

</script>
<script>
setTimeout(()=>{if(!window.__coveReady){const l=document.getElementById('loading');if(l&&!l.hidden)l.textContent='Could not load the 3D engine (three.js). Check the connection and reload.';}},25000);

  {x:95,z:-40,rx:17,rz:14,h:8,p:.8,type:'light'},
  {x:-104,z:8,rx:27,rz:42,h:5.5,p:.55,type:'village'},
  {x:80,z:47,rx:15,rz:8,h:1.5,p:.5,type:'sand'},
  {x:-62,z:-78,rx:15,rz:10,h:7,p:.8,type:'islet'},
  {x:64,z:-84,rx:18,rz:12,h:11,p:.8,type:'islet'},

function islandS(isl,x,z){const dx=(x-isl.x)/isl.rx,dz=(z-isl.z)/isl.rz;return 1-Math.sqrt(dx*dx+dz*dz)+(fbm(x*.08+isl.x,z*.08)-.5)*.5;}
function terrainH(x,z){let best=-5;for(const isl of ISLANDS){const s=islandS(isl,x,z);const h=s>0?isl.h*Math.pow(Math.min(s*1.6,1),isl.p)*(.75+.5*fbm(x*.15,z*.15)):s*6;if(h>best)best=h;}return best;}
function terrainN(x,z){const e=.5;return V.norm([terrainH(x-e,z)-terrainH(x+e,z),2*e,terrainH(x,z-e)-terrainH(x,z+e)]);}

  fragmentShader:`uniform vec3 uTop,uMid,uHor,uSun;varying vec3 vD;
  void main(){vec3 d=normalize(vD);float e=d.y;vec3 c=mix(uHor,uMid,smoothstep(0.,.16,e));c=mix(c,uTop,smoothstep(.16,.7,e));
    float s=dot(d,uSun);c=mix(c,vec3(1.,.9,.65),smoothstep(.93,1.,s)*.4);
    if(s>.9988)c=vec3(1.,.95,.75);else if(s>.9976)c=vec3(1.,.72,.25);

  uFoam:{value:new THREE.Color('#f5fbff')},uSkyH:{value:new THREE.Color('#c4e8ff')},uFogC:{value:FOG},uFogN:{value:260},uFogF:{value:1700},
  uIsl:{value:[...ISLANDS.map(i=>new THREE.Vector4(i.x,i.z,i.rx,i.rz)),new THREE.Vector4(0,0,30,4.5),new THREE.Vector4()]},
  uSt0:{value:ST.own},uSt1:{value:ST.enemy},uG0:{value:new THREE.Vector2(GRIDS.own.cx,GRIDS.own.cz)},uG1:{value:new THREE.Vector2(GRIDS.enemy.cx,GRIDS.enemy.cz)},
  uHover:{value:new THREE.Vector4(-1,0,0,0)},uPlace:{value:new THREE.Vector4()},uPlaceK:{value:0}};
const seaMat=new THREE.ShaderMaterial({uniforms:seaU,
  vertexShader:`uniform float uTime;varying vec3 vW;varying vec3 vN;varying float vH;
  float waveH(vec2 p,float t){return .32*sin(p.x*.11+p.y*.045+t*.9)+.2*sin(-p.x*.06+p.y*.13+t*1.25)+.1*sin(p.x*.19-p.y*.1+t*1.9);}
  void main(){vec3 w=(modelMatrix*vec4(position,1.)).xyz;float h=waveH(w.xz,uTime);float e=.6;
    float hx=waveH(w.xz+vec2(e,0.),uTime)-waveH(w.xz-vec2(e,0.),uTime),hz=waveH(w.xz+vec2(0.,e),uTime)-waveH(w.xz-vec2(0.,e),uTime);
    vN=normalize(vec3(-hx,2.*e,-hz));w.y+=h;vW=w;vH=h;gl_Position=projectionMatrix*viewMatrix*vec4(w,1.);}`,
  fragmentShader:`uniform float uTime,uFogN,uFogF,uPlaceK;uniform vec3 uSun,uDeep,uMid,uShallow,uFoam,uSkyH,uFogC;
  uniform vec4 uIsl[9];uniform sampler2D uSt0,uSt1;uniform vec2 uG0,uG1;uniform vec4 uHover,uPlace;
  varying vec3 vW;varying vec3 vN;varying float vH;
  vec3 s2l(vec3 c){return pow(c,vec3(2.2));}
  float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}

    float aa=max(max(fwidth(q.x),fwidth(q.y)),.002);
    vec2 cell=floor(clamp(q,0.,9.999)),f=q-cell;float r=length(f-.5);

    if(bd<0.){

      o=over(o,vec3(1.),.6*(1.-smoothstep(.02,.02+aa*1.5,d)));
      float s=floor(texelFetch(st,ivec2(cell),0).r*255./64.+.5);
      if(s==1.){o=over(o,s2l(vec3(.06,.25,.45)),.35);o=over(o,vec3(1.),1.-smoothstep(.045,.045+aa*1.5,abs(r-.24)));}
      if(s>=2.){bool sk=s>2.5;o=over(o,sk?s2l(vec3(.35,.06,.07)):s2l(vec3(1.,.42,.2)),.55);
        float X=(1.-smoothstep(.07,.07+aa*1.5,min(abs(f.x-f.y),abs(f.x+f.y-1.))))*step(r,.38);o=over(o,sk?s2l(vec3(.12,.02,.02)):s2l(vec3(.8,.06,.05)),X);}
      if(id==0.&&uPlaceK>0.){bool inS=uPlace.w>.5?(cell.y==uPlace.y&&cell.x>=uPlace.x&&cell.x<uPlace.x+uPlace.z):(cell.x==uPlace.x&&cell.y>=uPlace.y&&cell.y<uPlace.y+uPlace.z);
        if(inS){vec3 pc=uPlaceK<1.5?s2l(vec3(.3,1.,.45)):s2l(vec3(1.,.25,.2));o=over(o,pc,.45);o=over(o,pc,1.-smoothstep(.08,.08+aa*1.5,d));}}
      if(uHover.x==id&&uHover.w>0.){vec3 hc=uHover.w<1.5?s2l(vec3(1.,.84,.15)):s2l(vec3(1.,.3,.25));
        bool on=cell.x==uHover.y&&cell.y==uHover.z;
        if(!on&&(cell.x==uHover.y||cell.y==uHover.z))o=over(o,hc,.3);
        if(on){o=over(o,hc,.6+.2*sin(uTime*7.));o=over(o,hc,1.-smoothstep(.14,.14+aa*1.5,d));o=over(o,s2l(vec3(.17,.11,.07)),1.-smoothstep(.02,.02+aa*1.5,abs(d-.1)));
          float cr=(1.-smoothstep(.035,.035+aa*1.5,min(abs(f.x-.5),abs(f.y-.5))))*step(r,.3)*step(.12,r);o=over(o,vec3(1.),cr);}}
    }
    float rb=1.-smoothstep(.08,.08+aa*1.5,abs(bd));
    vec3 rc=id==1.?mix(s2l(vec3(.88,.18,.14)),vec3(1.),step(.5,fract(q.x+q.y))):mix(s2l(vec3(.15,.45,.85)),vec3(1.),step(.5,fract(q.x+q.y)));

  }
  void main(){vec2 p=vW.xz;
    vec2 rp=vec2(sin(p.x*.5+uTime*1.6+sin(p.y*.4)),sin(p.y*.6-uTime*1.3+sin(p.x*.3)))*.05;
    vec3 n=normalize(vN+vec3(rp.x,0.,rp.y));vec3 v=normalize(cameraPosition-vW);
    float sh=0.,fo=0.;
    for(int i=0;i<9;i++){vec4 I=uIsl[i];if(I.z<=0.)continue;float ed=length((p-I.xy)/I.zw);sh=max(sh,1.-smoothstep(1.,1.75,ed));
      fo=max(fo,smoothstep(1.4,1.05,ed)*step(.64,fract((ed-uTime*.045)*8.+noise(p*.2)*.7)));}
    vec3 c=mix(uDeep,uMid,smoothstep(-.35,.45,vH+(noise(p*.05+uTime*.02)-.5)*.5));
    c=mix(c,uShallow,sh);
    c*=dot(n,uSun)>.35?1.:.84;
    float fr=pow(1.-max(dot(n,v),0.),4.);c=mix(c,uSkyH,step(.42,fr)*.45);
    vec3 h=normalize(uSun+v);c=mix(c,vec3(1.),step(.75,pow(max(dot(n,h),0.),400.))*.85);
    float cf=step(.7,noise(p*.12+vec2(uTime*.12,-uTime*.08)))*smoothstep(.36,.5,vH);c=mix(c,uFoam,cf*.9);
    c=mix(c,uFoam,fo*.85);
    vec4 g=grid(p,uG0,0.,uSt0);c=mix(c,g.rgb,g.a);g=grid(p,uG1,1.,uSt1);c=mix(c,g.rgb,g.a);
    c=mix(c,uFogC,smoothstep(uFogN,uFogF,length(cameraPosition-vW)));
    gl_FragColor=vec4(c,1.);
    #include <colorspace_fragment>
  }`});
seaMat.userData.outlineParameters=NO_OUTLINE;
function seaGeo(n){const g=new THREE.PlaneGeometry(2,2,n,n);g.rotateX(-Math.PI/2);const p=g.attributes.position;
  const f=u=>Math.sign(u)*(120*Math.abs(u)+2880*Math.pow(Math.abs(u),5));   // dense (≈0.75 units) in the play area, coarse toward the horizon
  for(let i=0;i<p.count;i++)p.setXYZ(i,f(p.getX(i)),0,f(p.getZ(i)));g.deleteAttribute('uv');g.deleteAttribute('normal');return g;}
const SEA=new THREE.Mesh(seaGeo(coarse?200:320),seaMat);SEA.frustumCulled=false;scene.add(SEA);

  vertexShader:`varying vec2 vU;void main(){vU=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform float uTime;varying vec2 vU;void main(){float s=step(.55,fract(vU.y*5.+uTime*1.6+sin(vU.x*9.)*.15));
    vec3 c=mix(pow(vec3(.45,.8,.98),vec3(2.2)),vec3(1.),s*.85);gl_FragColor=vec4(c,1.);

  }`});

const bobbers=[];   // small floating things that ride the waves
function buildIslands(bt){
  const c=new THREE.Color();
  for(const isl of ISLANDS){
    const sx=isl.rx*2.7,sz=isl.rz*2.7,st=isl.type==='skull'?1.9:1.4;
    const g=new THREE.PlaneGeometry(sx,sz,Math.ceil(sx/st),Math.ceil(sz/st));g.rotateX(-Math.PI/2);
    const p=g.attributes.position,col=new Float32Array(p.count*3);
    for(let i=0;i<p.count;i++){const x=p.getX(i)+isl.x,z=p.getZ(i)+isl.z,h=Math.max(terrainH(x,z),-3.5);p.setXYZ(i,x,h,z);
      const slope=1-terrainN(x,z)[1];
      if(h<.35)c.set('#e2bb6c');else if(h<1.3||isl.type==='sand')c.set('#f5d88e');
      else if(slope>.3)c.set(isl.type==='skull'?'#7c7389':'#988e86');else c.set(fbm(x*.12,z*.12)>.5?'#6cc04a':'#59aa3e');
      col.set([c.r,c.g,c.b],i*3);}
    g.setAttribute('color',new THREE.BufferAttribute(col,3));bt.add(MAT.terrain,g);
  }
}
function buildSkull(bt){
  const c=[0,12,-95];
  bt.add(MAT.bone,sphere(1,36,24),mtx(c[0],c[1],c[2],0,0,0,15,13,11));
  bt.add(MAT.bone,sphere(1,28,16),mtx(c[0],c[1]-9,c[2]+3,0,0,0,10,5.2,8));
  for(const s of [-1,1])bt.add(MAT.socket,sphere(1,20,14),mtx(c[0]+s*5.6,c[1]+2.2,c[2]+10.2,0,0,0,3.4,4,1.9));
  bt.add(MAT.socket,new THREE.ConeGeometry(1.5,3,3),mtx(c[0],c[1]-3,c[2]+10.6,0,0,0,1,1,.6));
  for(let k=0;k<7;k++)bt.add(MAT.white,new THREE.BoxGeometry(1.45,2,1.2),mtx(c[0]+(k-3)*1.6,c[1]-6.2,c[2]+10.3+(.2-Math.abs(k-3)*.08),0,(k-3)*.07,0));
  // cliff with a waterfall and a foam pool
  bt.add(MAT.rock,new THREE.CylinderGeometry(4.6,6.2,24,7),mtx(30,11,-93.5));
  const wf=new THREE.Mesh(new THREE.PlaneGeometry(5.6,22.5,1,1),fallMat);wf.position.set(30,11,-88.9);scene.add(wf);
  bt.add(MAT.white,new THREE.CylinderGeometry(4.5,4.5,.3,20),mtx(30,.05,-86,0,0,0,1,1,.6));
}
function buildLighthouse(bt){
  const x=95,z=-42,y0=terrainH(x,z)-.6,h=17,n=6;
  for(let k=0;k<n;k++){const r0=2.7-1.0*k/n,r1=2.7-1.0*(k+1)/n;bt.add(k%2?MAT.red:MAT.white,new THREE.CylinderGeometry(r1,r0,h/n,16),mtx(x,y0+(k+.5)*h/n,z));}
  bt.add(MAT.iron,new THREE.CylinderGeometry(2.4,2.4,.4,16),mtx(x,y0+h+.2,z));
  bt.add(MAT.glass,new THREE.CylinderGeometry(1.4,1.4,2.2,12),mtx(x,y0+h+1.5,z));
  bt.add(MAT.red,new THREE.ConeGeometry(2,2.4,12),mtx(x,y0+h+3.8,z));
  bt.add(MAT.brass,sphere(.35),mtx(x,y0+h+5.1,z));
  bt.add(MAT.woodDark,new THREE.BoxGeometry(.4,2.2,1.2),mtx(x-2.55,y0+1.6,z));
}
function house(bt,x,z,sx,sz,sy,yaw,k){
  const y=terrainH(x,z)-.4;
  bt.add(MAT.walls[k%4],new THREE.BoxGeometry(sx,sy+.4,sz),mtx(x,y+(sy+.4)/2,z,0,yaw,0));
  const cone=new THREE.ConeGeometry(1,1,4);cone.rotateY(Math.PI/4);
  bt.add(MAT.roofs[k%4],cone,mtx(x,y+.4+sy+sz*.33,z,0,yaw,0,sx*.86,sz*.66,sz*.86));
  const ax=[Math.cos(yaw),0,-Math.sin(yaw)],az=[Math.sin(yaw),0,Math.cos(yaw)];
  for(const off of [-sz*.25,sz*.25])bt.add(MAT.lens,new THREE.BoxGeometry(.12,.9,.9),mtx(x+ax[0]*(sx/2+.04)+az[0]*off,y+.4+sy*.6,z+ax[2]*(sx/2+.04)+az[2]*off,0,yaw,0));
  bt.add(MAT.woodDark,new THREE.BoxGeometry(.12,1.6,1),mtx(x-ax[0]*(sx/2+.04),y+1.2,z-ax[2]*(sx/2+.04),0,yaw,0));
}
function leafGeo(top,a,len){const N=8,pos=[],idx=[],d=[Math.cos(a),0,Math.sin(a)],s=[-Math.sin(a),0,Math.cos(a)];
  for(let i=0;i<=N;i++){const t=i/N,w=.95*Math.pow(Math.sin(Math.PI*Math.min(1,t*1.05+.06)),.8)+.04;
    const cx=top.x+d[0]*t*len,cy=top.y+Math.sin(t*2.2)*1.1-t*t*2.5,cz=top.z+d[2]*t*len;
    pos.push(cx,cy+.12,cz, cx+s[0]*w,cy-.18*w,cz+s[2]*w, cx-s[0]*w,cy-.18*w,cz-s[2]*w);}
  for(let i=0;i<N;i++){const a0=i*3,a1=(i+1)*3;idx.push(a0,a0+1,a1, a1,a0+1,a1+1, a0,a1,a0+2, a1,a1+2,a0+2);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);return g;}
function palm(bt,x,z,h){
  const y=terrainH(x,z)-.3,lean=rr(0,6.28),lx=Math.cos(lean)*2.3,lz=Math.sin(lean)*2.3;
  const curve=new THREE.QuadraticBezierCurve3(new THREE.Vector3(x,y,z),new THREE.Vector3(x+lx*.15,y+h*.6,z+lz*.15),new THREE.Vector3(x+lx,y+h,z+lz));
  bt.add(MAT.trunk,new THREE.TubeGeometry(curve,8,.34,6,false));
  const top=curve.getPoint(1);
  for(let f=0;f<7;f++)bt.add(MAT.leaf,leafGeo(top,f/7*6.283+rr(-.2,.2),rr(3.6,4.8)));
  for(let k=0;k<3;k++){const a=k/3*6.28;bt.add(MAT.coco,sphere(.33,8,6),mtx(top.x+Math.cos(a)*.38,top.y-.35,top.z+Math.sin(a)*.38));}
}
function rowboat(x,z,lamp){const g=new THREE.Group(),bt=new Batch();
  bt.add(MAT.wood,new THREE.SphereGeometry(1,16,8,0,Math.PI*2,Math.PI/2,Math.PI/2),mtx(0,.35,0,0,0,0,2.4,1,1));
  bt.add(MAT.deck,new THREE.CylinderGeometry(1,1,.08,16),mtx(0,.3,0,0,0,0,2.2,1,.9));
  bt.add(MAT.woodDark,new THREE.BoxGeometry(.3,.12,1.8),mtx(.4,.42,0));
  if(lamp){bt.add(MAT.woodDark,cylBetween([-1.6,.3,0],[-1.6,1.4,0],.04,.04,5));bt.add(MAT.glass,sphere(.18),mtx(-1.6,1.5,0));}
  bt.build(g);g.position.set(x,0,z);g.rotation.y=R()*6;scene.add(g);bobbers.push({o:g,x,z,y:0,k:.6});}
function buildVillage(bt){
  const hs=[[-112,-24,6,5,4,.1],[-106,-12,5,6,4.5,-.2],[-113,-2,6,5,4,0],[-104,9,5,5,4,.15],[-111,20,7,6,5,-.1],[-103,31,5,5,3.8,.2],[-118,12,5,6,4.5,.05]];
  hs.forEach(([x,z,sx,sz,sy,yaw],k)=>house(bt,x,z,sx,sz,sy,yaw,k));
  for(const dz of [0,19]){bt.add(MAT.deck,new THREE.BoxGeometry(22,.35,3),mtx(-71,1.05,dz));
    for(let x=-80;x<=-60;x+=4)for(const s of [-1.5,1.5])bt.add(MAT.woodDark,new THREE.CylinderGeometry(.24,.24,3,6),mtx(x,-.3,dz+s));
    bt.add(MAT.woodDark,cylBetween([-60.5,1.2,dz+1.5],[-60.5,3,dz+1.5],.07,.07,5));bt.add(MAT.glass,sphere(.25),mtx(-60.5,3.15,dz+1.5));}
  for(const [x,z] of [[-96,-30],[-92,-6],[-95,14],[-94,36],[-120,30],[-88,25],[-122,-12],[-70,68],[-76,75],[-66,77],[58,-80],[-60,-74],[86,-36],[100,-46],[78,50]])palm(bt,x,z,rr(7,10));
  for(const [x,z,l] of [[-55,6,1],[-52,24,0],[-64,-14,0]])rowboat(x,z,l);
}
function buildReef(bt){

    bt.add(R()<.55?MAT.rock:MAT.rockDark,new THREE.DodecahedronGeometry(1,0),mtx(x,rr(-.5,.1),z,R()*3,R()*3,R()*3,s*1.4,s*.8,s));}
  for(let i=0;i<26;i++){const x=rr(-26,26),z=rr(-2.5,2.5);bt.add(R()<.5?MAT.coral1:MAT.coral2,new THREE.ConeGeometry(.35,rr(1,1.8),5),mtx(x,.3,z,rr(-.3,.3),0,rr(-.3,.3)));}
}
function buildWreck(bt){
  const g=hullGeo(11,2.6,1.6,{hull:'#7a6a5c',stripe:'#8c7a62',bottom:'#4f4339',cap:'#3d332b'},true);
  const m=new THREE.Mesh(g,toon('#ffffff',{vertexColors:true}));m.position.set(80,-.9,47);m.rotation.set(.35,.6,.42);m.castShadow=m.receiveShadow=true;scene.add(m);

function buildGridPosts(bt){

    for(let r=0;r<10;r++){bt.add(MAT.woodDark,new THREE.CylinderGeometry(.2,.24,3.6,6),mtx(x0-1.6,.6,z0+(r+.5)*C));bt.add(cap,sphere(.32),mtx(x0-1.6,2.5,z0+(r+.5)*C));}}

let VOLCANO;
function buildMountains(bt){

const G=20;
let physics=null;
const BALL_GEO=sphere(.45,12,8);

function launch(from,to){

    const ball={p:from.slice(),v,to,res,t:0,T,body:null,trail:0,mesh};
    if(physics){try{const{RA,world:w}=physics;ball.body=w.createRigidBody(RA.RigidBodyDesc.dynamic().setTranslation(...from).setLinvel(...v).setCcdEnabled(true));

    const deck=fp.on;   // aboard, the gun is an arm's length away: keep its smoke small and blowing forward

  });
}

function shipCenter(b,s){const g=b===player?GRIDS.own:GRIDS.enemy;const pts=s.cells.map(i=>cellCenter(g,i));return pts.reduce((a,p)=>V.add(a,V.mul(p,1/pts.length)),[0,0,0]);}
const MISS_P=['Splash at %c. Only fish down there.','Water at %c. The gulls are laughing.','%c: nothing but salt and foam.'];

const line=(a,c)=>a[rnd(a.length)].replace('%c',c);

async function playerFire(i){

  if(r.hit)log(r.ship.sunk?`Ye sank their ${r.ship.name}! (${coord(i)})`:line(HIT_P,coord(i)),'you');else log(line(MISS_P,coord(i)));

async function enemyFire(){
  const i=$('difficulty').value==='deckhand'?aiDeckhand():bestShot(player,aiSunk);

  if(!fast)await launch(from,to);

// "Cunning Captain": counts how many legal ship positions cover each square, strongly preferring positions through unsunk hits
function bestShot(b,sunkSet){
  const shot=b.shot,open=[];for(let i=0;i<100;i++)if(shot[i]===2&&!sunkSet.has(i))open.push(i);
  const lens=b.ships.filter(s=>!s.sunk).map(s=>s.len);
  const score=need=>{const sc=Array(100).fill(0);for(const len of lens)for(let s=0;s<100;s++)for(const h of[true,false]){
    const cs=cellsFor(s,len,h);if(!cs)continue;let bad=false,cov=0;for(const c of cs){if(shot[c]===1||sunkSet.has(c)){bad=true;break;}if(shot[c]===2)cov++;}
    if(bad||(need&&!cov))continue;const w=cov?Math.pow(cov+1,4)*8:1;for(const c of cs)if(!shot[c])sc[c]+=w;}return sc;};
  let sc=score(open.length>0);if(!sc.some(v=>v>0))sc=score(false);
  let best=-1,cand=[];for(let i=0;i<100;i++){if(shot[i])continue;if(sc[i]>best){best=sc[i];cand=[i];}else if(sc[i]===best)cand.push(i);}
  return cand.length?cand[rnd(cand.length)]:shot.findIndex(v=>!v);
}
function aiDeckhand(){const shot=player.shot,around=[];
  for(let i=0;i<100;i++)if(shot[i]===2&&!aiSunk.has(i)){const r=Math.floor(i/N),c=i%N;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b2])=>{const y=r+a,x=c+b2;if(y>=0&&y<N&&x>=0&&x<N&&!shot[y*N+x])around.push(y*N+x);});}
  if(around.length&&R()<.6)return around[rnd(around.length)];const free=[];for(let i=0;i<100;i++)if(!shot[i])free.push(i);return free[rnd(free.length)];}

const keys=new Set();
const lerp3=(a,b,t)=>V.add(a,V.mul(V.sub(b,a),t));
function fpCamera(dt){

  const castle=sh.len>=3,lx=castle?-sh.L*.36:-sh.L*.3,ly=castle?rimY(-.72,sh.H)+1.2+1.75:rimY(-.6,sh.H)+1.6;

    c.fillStyle='rgba(255,230,120,.28)';c.beginPath();c.moveTo(px,pz);c.lineTo(...d(Y+hf));c.lineTo(...d(Y-hf));c.closePath();c.fill();
    c.fillStyle='#ffd23f';c.strokeStyle='#2b1d12';c.lineWidth=2;c.beginPath();c.arc(px,pz,5,0,7);c.fill();c.stroke();}
}
function miniCell(e){const r=MINI.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*MW,y=(e.clientY-r.top)/r.height*MH;return cellAt(GRIDS.enemy,(x-10)/MS-18,(y-32)/MS-42);}
MINI.addEventListener('pointermove',e=>{lastPtr=null;const i=miniCell(e);hoverGrid=i>=0?'enemy':null;hoverCell=i;});
MINI.addEventListener('pointerleave',()=>{hoverGrid=null;hoverCell=-1;});
MINI.addEventListener('click',e=>{const i=miniCell(e);if(i<0||phase!=='battle'||enemy.shot[i])return;if(coarse){aim=i;hud();}else playerFire(i);});
// ======================================================================
//  Render loop
// ======================================================================
let now=0,tw=0,last=performance.now(),fpsAcc=0,fpsN=0;
function resize(){renderer.setSize(innerWidth,innerHeight,false);}
function frame(ms){
  const dt=Math.min(.05,Math.max(0,(ms-last)/1000));last=ms;now+=dt;tw=reduced?0:now;
  fpsAcc+=dt;fpsN++;if(fpsAcc>1){const fps=fpsN/fpsAcc;fpsAcc=0;fpsN=0;const maxS=Math.min(devicePixelRatio||1,2);let ns=renderScale;
    if(fps<38&&ns>.5)ns=Math.max(.5,ns*.85);else if(fps>56&&ns<maxS)ns=Math.min(maxS,ns*1.06);
    if(Math.abs(ns-renderScale)>.01){renderScale=ns;renderer.setPixelRatio(ns);resize();}
    $('tech').textContent=`three.js toon · ${Math.round(fps)} fps · ${Math.round(renderScale*100)}% res`;}
  if(tour){tourT+=dt;const s=tourT;cam.yaw=.25+s*.11;cam.pitch=.35+.2*Math.sin(s*.17);cam.dist=130+55*Math.sin(s*.11);cam.target=[38*Math.sin(s*.07),0,-10+28*Math.cos(s*.09)];}
  stepSim(dt);updateShips();syncCaptain();
  let fpOn=false;
  if(fp.on&&fpCamera(dt))fpOn=true;
  else{const e=camEye();const sk=reduced?0:shake*shake*.9*cam.dist/110,shk=[Math.sin(now*47)*sk,Math.sin(now*61+1)*sk*.7,Math.sin(now*53+2)*sk];
    camera.position.set(...V.add(e,V.mul(shk,.4)));camera.up.set(0,1,0);const t=V.add(cam.target,V.mul(shk,3));camera.lookAt(t[0],t[1],t[2]);fovDeg=50;}
  fp.ready=true;
  if(fp.startOwn&&fp.on&&fp.wp){fp.startOwn=false;lookBack();fp.yaw=fp.yawT;}
  PLAT.visible=fpOn;
  camera.fov=fovDeg;camera.aspect=innerWidth/innerHeight;camera.near=fpOn?.1:.5;camera.updateProjectionMatrix();camera.updateMatrixWorld();
  if(lastPtr&&!ptrs.size)pick(...lastPtr);   // the view moves on its own (waves, turning), so keep the hovered square under the pointer
  seaU.uTime.value=tw;SKY.position.copy(camera.position);
  updateStates();updateAim();updateFX(dt);drawParts();updateLife();
  renderer.clear();effect.render(scene,camera);
  const hands=fpOn&&fp.zoom<.5;HANDS.visible=hands;
  if(hands){vmCam.position.copy(camera.position);vmCam.quaternion.copy(camera.quaternion);vmCam.aspect=camera.aspect;vmCam.updateProjectionMatrix();
    const sw=reduced?0:.006*Math.sin(now*1.7),dy=-.3-fp.zoom*.4+sw,hx=Math.min(.32,.38*camera.aspect*.55);
    HL.position.set(-hx,dy,-.78);HL.rotation.set(.12,.18,0);HR.position.set(hx,dy+sw*.5-.04*fp.recoil,-.78+.03*fp.recoil);HR.rotation.set(.05-.15*fp.recoil,-.14,0);
    vmCam.updateMatrixWorld(true);renderer.clearDepth();effect.render(vmScene,vmCam);}
  $('spyMask').style.opacity=fpOn?fp.zoom:0;
  placeLabels();updateTip();drawMini();
  if(!frame.tick)requestAnimationFrame(frame);
}

// ======================================================================
//  Sound (WebAudio, muted by default)
// ======================================================================
let actx=null,soundOn=false;
function sfx(type){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;
  const noise=(dur,freq,q,gain,f='lowpass')=>{const len=Math.floor(actx.sampleRate*dur),buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(R()*2-1)*Math.pow(1-i/len,2);const s=actx.createBufferSource(),fl=actx.createBiquadFilter(),g=actx.createGain();
    s.buffer=buf;fl.type=f;fl.frequency.value=freq;fl.Q.value=q;g.gain.value=gain;s.connect(fl).connect(g).connect(actx.destination);s.start(t);};
  const tone=(f0,f1,dur,gain,w='sine')=>{const o=actx.createOscillator(),g=actx.createGain();o.type=w;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur);};
  if(type==='fire'){noise(.35,900,.7,.5);tone(120,40,.3,.5);}if(type==='boom'){noise(.9,420,.8,.9);tone(70,30,.7,.7);}
  if(type==='splash')noise(.6,1400,1.2,.35,'bandpass');if(type==='thud')tone(180,90,.12,.25,'triangle');
  if(type==='win')[392,523,659,784].forEach((f,k)=>setTimeout(()=>tone(f,f,.25,.2,'triangle'),k*140));}catch(e){}}

// ======================================================================
//  Physics: Rapier if it loads, otherwise built-in ballistic integration
// ======================================================================
async function initPhysics(){
  try{const mod=await import('https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js');const RA=mod.default||mod;await RA.init();
    physics={RA,world:new RA.World({x:0,y:-G,z:0}),acc:0};physics.world.timestep=1/60;$('phys').textContent='physics: Rapier';}
  catch(e){physics=null;$('phys').textContent='physics: built-in';}
}

// ======================================================================
//  Boot
// ======================================================================
$('rotateBtn').onclick=()=>{horiz=!horiz;};
$('shuffleBtn').onclick=()=>{randomFleet(player,true);picked=null;hud();};
$('sailBtn').onclick=setSail;
$('newBtn').onclick=newGame;$('againBtn').onclick=newGame;
$('tourBtn').onclick=toggleTour;
$('capBtn').onclick=()=>setCaptain(!fp.want);
$('backBtn').onclick=lookBack;
$('fireBtn').onclick=()=>{if(aim>=0)playerFire(aim);};
$('soundBtn').onclick=()=>{soundOn=!soundOn;$('soundBtn').textContent='Sound: '+(soundOn?'on':'off');$('soundBtn').setAttribute('aria-pressed',soundOn);$('soundBtn').classList.toggle('on',soundOn);if(soundOn)sfx('thud');};
addEventListener('resize',resize);
(async()=>{
  try{buildAll();setupBuoys();}catch(e){$('loading').textContent='Could not build the scene: '+e.message;console.error(e);return;}
  makeLabels();newGame();$('loading').hidden=true;window.__coveReady=true;
  initPhysics();
  const hash=location.hash,tags=hash.slice(1).split('+');
  if(tags.includes('tour'))toggleTour();
  if(hash.startsWith('#demo')){ // plays a few rounds instantly so the first frame shows a battle in progress
    fast=true;setSail();for(let k=0;k<26&&phase==='battle';k++){const sunk=new Set();enemy.ships.filter(s=>s.sunk).forEach(s=>s.cells.forEach(c=>sunk.add(c)));await playerFire(bestShot(enemy,sunk));}
    fast=false;[player,enemy].forEach(b=>b.ships.forEach(s=>{if(s.sunk)s.sunkAt=now-2.5;}));parts=[];busy=false;turn='player';hud();
    if(tags.includes('demo-wide')){cam.dist=190;cam.pitch=.4;cam.yaw=.5;}
  }
  if(tags.includes('sail'))setSail();
  if(tags.includes('dbg')){window.__err='';addEventListener('error',e=>{window.__err+=e.message+' @'+e.lineno+' ';});addEventListener('unhandledrejection',e=>{window.__err+='REJ '+(e.reason&&e.reason.stack||e.reason)+' ';});}
  if(tags.includes('dbg'))setInterval(()=>{const b=balls[0];$('status').textContent='DBG '+JSON.stringify({err:window.__err,n:balls.length,t:b&&b.t.toFixed(2),T:b&&b.T.toFixed(2),p:b&&b.p.map(v=>v.toFixed(1)),now:now.toFixed(1),busy,turn,shots:stats.shots,parts:parts.length,phys:!!physics,err:window.__err});},200);   // preview aid: skip placement
  if(tags.includes('captain'))setCaptain(true);
  if(tags.includes('zoom'))fp.zoom=fp.zoomT=1;
  if(tags.includes('fire'))setInterval(()=>{if(phase==='battle'&&turn==='player'&&!busy){const i=[95,94,96,93,97,85,84,86].find(k=>!enemy.shot[k])??enemy.shot.findIndex(v=>!v);playerFire(i);}},300);   // preview aid: keep firing
  if(tags.includes('back'))fp.startOwn=true;
  if(tags.includes('aim')&&phase==='battle'){const i=[95,93,97,86,84,75,73,66].find(k=>!enemy.shot[k]);if(i!==undefined){hoverGrid='enemy';hoverCell=i;}}
  if(tags.includes('tick')){frame.tick=true;last=performance.now();setInterval(()=>frame(performance.now()),40);}   // preview aid: headless browsers starve requestAnimationFrame
  else requestAnimationFrame(t=>{last=t;frame(t);});
})();
window.__cove={get phase(){return phase},get player(){return player},get enemy(){return enemy},get physics(){return physics},cam,fp,setCaptain,rayGround,camera};
